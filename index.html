<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Clément Vigier</title>
  <meta name="description" content="Portfolio de Clément Vigier — intégration web, projets et contact">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <meta name="description" content="Page d'acceuil du portfolio de Clément Vigier">

  <link rel="icon" href="./img/logofinal.png">


  <link href="./style.css" rel="stylesheet">

</head>

<body>
  <!-- Background layers -->
  <div class="bg-overlay bg-gradient"></div>
  <div class="bg-overlay bg-pattern"></div>

  <!-- HERO Terminal -->
  <section class="hero-terminal" aria-hidden="false">
    <div class="terminal" id="terminal" role="status" aria-live="polite"></div>
  </section>

  <main>
    <!-- SECTIONS MINIMALISTES (remplacé par cards Bootstrap) -->
    <section class="py-5">
      <div class="container cards-container">

        <div class="row g-4 justify-content-center cards-grid">
          <div class="col-sm-6 col-md-4 d-flex">
            <a href="./projet.html" class="card-link w-100" aria-label="Aller à Mes Projets">
              <div class="card bg-dark text-white h-100 w-100">
                <img src="./img/projet.png" class="card-img-top" alt="illustration projets">
                <div class="card-body">
                  <h3 class="h2 m-0 p-0 text-center">Mes Projets</h3>
                </div>
              </div>
            </a>
          </div>

          <div class="col-sm-6 col-md-4 d-flex">
            <a href="./A_propos.html" class="card-link w-100" aria-label="Aller à Qui suis-je">
              <div class="card bg-dark text-white h-100 w-100">
                <img src="./img/profil.png" class="card-img-top" alt="illustration à propos">
                <div class="card-body">
                  <h3 class="h2 m-0 p-0 text-center">Mon profil</h3>
                </div>
              </div>
            </a>
          </div>

          <div class="col-sm-6 col-md-4 d-flex">
            <a href="./contact.html" class="card-link w-100" aria-label="Aller à Mon expérience">
              <div class="card bg-dark text-white h-100 w-100">
                <img src="./img/contact.png" class="card-img-top" alt="illustration compétences">
                <div class="card-body">
                  <h3 class="h2 m-0 p-0 text-center">Contact</h3>
                </div>
              </div>
            </a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <div class="container d-flex justify-content-between align-items-center p-3">
      <small class="">© 2026 Clément Vigier — Portfolio</small>
      <div class="footer-links">
        <a href="./mentions_legales.html" class="h6 me-3">Mentions légales</a>
        <a href="./pdc.html" class="h6">Politique de confidentialité</a>
      </div>
    </div>
  </footer>

  <!-- DEV reset button (hidden by default) -->
  <button id="dev-reset" class="btn btn-outline-light btn-sm" title="Reset terminal animation"
    style="position:fixed;right:16px;bottom:16px;z-index:3000;display:none;">Reset animation</button>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


  <script src="./terminal.js"></script>

</body>

</html>
